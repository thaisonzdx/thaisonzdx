name: release on a new tag

on:
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9].[0-9][0-9]"
  # For tags whose commit predates this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (YY.MM.DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          # Title the release with the annotated tag's subject, e.g. "26.11.24: Portfolio launch".
          title="$TAG"
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" = "tag" ]; then
            subject=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message | head -n 1)
            [ -n "$subject" ] && title="$TAG: $subject"
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$title" \
            --generate-notes \
            --verify-tag
